<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEMORIA 共有アルバム</title><style>body{font-family:-apple-system,sans-serif;background:#fff7ed;color:#493525;margin:0}header{background:#79543e;color:white;padding:16px;text-align:center}main{max-width:850px;margin:auto;padding:14px}button,.pick{border:0;border-radius:10px;background:#79543e;color:white;padding:13px;font-size:16px;display:inline-block;margin:5px}input{display:none}.sheet{display:grid;grid-template-columns:1fr 1fr;gap:8px}.page{border:1px solid #ddc8af;background:white;border-radius:10px;padding:9px;min-height:48vh;overflow:hidden}.tile{background:#f7f0e8;border-radius:9px;padding:6px;margin:7px 0;min-height:80px}.tile img,.tile video{width:100%;max-height:260px;object-fit:contain}.tile p{white-space:pre-wrap;font-size:13px}.nav{display:flex;justify-content:space-between;align-items:center}small{color:#765e4d}#book{display:none}h2{font-size:15px}h3{font-size:13px}@media(max-width:500px){.page{padding:5px}.tile{padding:4px}.tile img,.tile video{max-height:180px}}</style></head><body><header><h1>📖 MEMORIA</h1>共有アルバム（閲覧専用）</header><main><section id="setup"><p>送られてきた共有ZIPを<strong>すべて選択</strong>してください。ページを表示するときだけ写真・動画を読み込みます。</p><label class="pick">📦 ZIPをまとめて選択<input id="files" type="file" multiple accept=".zip,application/zip"></label><p id="status">ZIPを選んでください</p><button id="start" disabled>アルバムをひらく</button></section><section id="book"><div class="nav"><button id="prev">◀</button><strong id="count"></strong><button id="next">▶</button></div><div class="sheet"><div class="page" id="left"></div><div class="page" id="right"></div></div><button id="back">ZIP選択に戻る</button></section><p><small>写真・動画は外部サーバーへ送信されません。SafariでこのHTMLを開いてご利用ください。</small></p></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"\u0027":"&#39;"}[c]));let album=null,locations=new Map(),page=0,rev=0;const urls=[];
async function scan(file){let pos=0,manifest=null,media=[];const dec=new TextDecoder();while(pos+30<=file.size){const h=new DataView(await file.slice(pos,pos+30).arrayBuffer());if(h.getUint32(0,true)!==0x04034b50)break;const flags=h.getUint16(6,true),method=h.getUint16(8,true),size=h.getUint32(18,true),n=h.getUint16(26,true),ex=h.getUint16(28,true);if(method||flags&8)throw Error('未対応のZIP形式です');const name=dec.decode(await file.slice(pos+30,pos+30+n).arrayBuffer()),start=pos+30+n+ex;if(start+size>file.size)throw Error('ZIPが不完全です');if(name==='manifest.json')manifest=JSON.parse(await file.slice(start,start+size).text());if(name.startsWith('media/')&&name.endsWith('.json'))media.push({key:decodeURIComponent(name.slice(6,-5)),file,start,size});pos=start+size}if(!manifest)throw Error('manifest.json がありません');return {manifest,media}}
$('files').onchange=async e=>{try{const fs=[...e.target.files];$('start').disabled=true;locations.clear();if(!fs.length)return;const parts=[];for(let i=0;i<fs.length;i++){$('status').textContent='ZIP確認中 '+(i+1)+'/'+fs.length;parts.push(await scan(fs[i]))}const first=parts[0].manifest;if(first.type!=='MEMORIA_SHARE_PARTS'||first.version!==1)throw Error('共有用ZIPを選んでください');if(parts.length!==first.total)throw Error('ZIPが不足しています：必要 '+first.total+'個／選択 '+parts.length+'個');const nums=new Set(parts.map(x=>x.manifest.part));if(nums.size!==first.total||parts.some(x=>x.manifest.session!==first.session||x.manifest.total!==first.total))throw Error('同じアルバムの全ZIPを選んでください');const head=parts.find(x=>x.manifest.part===1);album=head?.manifest.album;if(!album)throw Error('1番目のZIPがありません');for(const part of parts)for(const m of part.media){if(locations.has(m.key))throw Error('重複データ：'+m.key);locations.set(m.key,m)}const missing=first.allKeys.filter(k=>!locations.has(k));if(missing.length)throw Error('メディアが不足：'+missing.length+'件');$('status').textContent='全'+locations.size+'件・'+(album.events||[]).length+'ページの確認完了。閲覧できます。';$('start').disabled=false}catch(err){$('status').textContent='読み込み失敗：'+err.message}}
async function media(key){const m=locations.get(key);if(!m)return null;const raw=JSON.parse(await m.file.slice(m.start,m.start+m.size).text());const uri=raw.src||raw.thumb;if(!uri)return null;const match=/^data:([^;,]+)?;base64,([\s\S]*)$/.exec(uri);if(!match)return uri;const b64=match[2],chunks=[];for(let i=0;i<b64.length;i+=65536){const str=atob(b64.slice(i,i+65536)),bytes=new Uint8Array(str.length);for(let j=0;j<str.length;j++)bytes[j]=str.charCodeAt(j);chunks.push(bytes)}const url=URL.createObjectURL(new Blob(chunks,{type:match[1]||'application/octet-stream'}));urls.push(url);return url}
async function render(){const token=++rev;for(const u of urls)URL.revokeObjectURL(u);urls.length=0;const events=album.events||[];$('count').textContent=(page+1)+' / '+events.length;$('prev').disabled=page===0;$('next').disabled=page>=events.length-1;for(const [side,id] of [['L','left'],['R','right']]){const el=$(id),event=events[page];el.replaceChildren();const h=document.createElement('h2');h.textContent=(event?.name||'思い出')+'・'+(side==='L'?'左':'右');el.append(h);for(let i=0;i<2;i++){const key=page+':'+side+':'+i,p=album.photos?.[key],tile=document.createElement('div');tile.className='tile';if(p){const label=document.createElement('small');label.textContent='読み込み中…';tile.append(label);el.append(tile);try{const src=await media(key);if(token!==rev)return;label.remove();if(src){const item=document.createElement(p.type==='video'?'video':'img');item.src=src;if(p.type==='video'){item.controls=true;item.playsInline=true;item.preload='metadata'}else item.loading='lazy';tile.append(item)}if(p.title){const t=document.createElement('h3');t.textContent=p.title;tile.append(t)}if(p.message){const t=document.createElement('p');t.textContent=p.message;tile.append(t)}}catch(err){label.textContent='読み込み失敗：'+err.message}}else{tile.textContent='';el.append(tile)}}}}
$('start').onclick=()=>{page=0;$('setup').style.display='none';$('book').style.display='block';render()};$('prev').onclick=()=>{if(page){page--;render()}};$('next').onclick=()=>{if(page+1<(album?.events?.length||0)){page++;render()}};$('back').onclick=()=>{$('book').style.display='none';$('setup').style.display='block';++rev;urls.forEach(URL.revokeObjectURL);urls.length=0};let touch=null;$('book').addEventListener('touchstart',e=>{touch=e.touches[0].clientX},{passive:true});$('book').addEventListener('touchend',e=>{if(touch===null)return;const d=e.changedTouches[0].clientX-touch;if(Math.abs(d)>90){if(d<0&&page+1<album.events.length)page++;else if(d>0&&page>0)page--;render()}touch=null},{passive:true});
</script></body></html>
